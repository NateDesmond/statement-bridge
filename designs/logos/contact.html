<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Statement Bridge — Icon Candidates</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f2f2f2; padding: 40px; }
  h1 { font-size: 20px; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; padding: 16px; background: #fff; border-radius: 8px; }
  .row.dark { background: #1a1a1a; color: #fff; }
  .name { width: 160px; font-weight: 600; }
  .swatch { display: flex; gap: 16px; align-items: center; padding: 12px; border-radius: 8px; }
  .swatch.white { background: #fff; }
  .swatch.dark { background: #111; }
  img.big { width: 128px; height: 128px; }
  img.small { width: 32px; height: 32px; }
</style>
</head>
<body>
<h1>Statement Bridge — 5 icon candidates</h1>

<div class="row">
  <div class="name">1. The Ledger</div>
  <div class="swatch white"><img class="big" src="logo-1.png"><img class="small" src="logo-1.png"></div>
  <div class="swatch dark"><img class="big" src="logo-1.png"><img class="small" src="logo-1.png"></div>
</div>

<div class="row">
  <div class="name">2. The Console</div>
  <div class="swatch white"><img class="big" src="logo-2.png"><img class="small" src="logo-2.png"></div>
  <div class="swatch dark"><img class="big" src="logo-2.png"><img class="small" src="logo-2.png"></div>
</div>

<div class="row">
  <div class="name">3. The Guide</div>
  <div class="swatch white"><img class="big" src="logo-3.png"><img class="small" src="logo-3.png"></div>
  <div class="swatch dark"><img class="big" src="logo-3.png"><img class="small" src="logo-3.png"></div>
</div>

<div class="row">
  <div class="name">4. The Grid</div>
  <div class="swatch white"><img class="big" src="logo-4.png"><img class="small" src="logo-4.png"></div>
  <div class="swatch dark"><img class="big" src="logo-4.png"><img class="small" src="logo-4.png"></div>
</div>

<div class="row">
  <div class="name">5. The Vault</div>
  <div class="swatch white"><img class="big" src="logo-5.png"><img class="small" src="logo-5.png"></div>
  <div class="swatch dark"><img class="big" src="logo-5.png"><img class="small" src="logo-5.png"></div>
</div>

</body>
</html>
