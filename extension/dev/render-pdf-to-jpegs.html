<!doctype html>
<html><body>
<div id="out">running</div>
<script type="module">
import { withPdfjs } from '../src/core/pdf.js';

const params = new URLSearchParams(location.search);
const src = params.get('src');
const scale = Number(params.get('scale') || '2');

async function main() {
  const bytes = new Uint8Array(await (await fetch(src)).arrayBuffer());
  const pages = await withPdfjs(async (pdfjsLib, standardFontDataUrl) => {
    const doc = await pdfjsLib.getDocument({ data: bytes, standardFontDataUrl }).promise;
    const out = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      // White background, same reasoning as dev/render-page-to-jpeg.html:
      // a scanned statement page is white paper, and an unfilled
      // (transparent) canvas would turn black once re-encoded as opaque JPEG.
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      out.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.92), width: canvas.width, height: canvas.height });
    }
    return out;
  });
  document.getElementById('out').textContent = JSON.stringify({ pages });
}
main().catch((e) => { document.getElementById('out').textContent = JSON.stringify({ error: String(e && e.stack || e) }); });
</script>
</body></html>
