<!doctype html>
<meta charset="utf-8">
<title>Pin it mockup</title>
<!--
  tools/pin-menu-mockup.html

  Source for onboarding/pin-menu.png, the picture in the pin step.

  Drawn rather than screenshotted for the same reason as Profanity Muter's
  copy of this file (see its longer note): a real screenshot of the
  Chrome extensions menu carries other vendors' names and icons, which is
  third-party material to ship in our package and which dates the moment
  Chrome's own chrome changes. The neighbour rows here are generic grey
  placeholders; the only real artwork is our own icon48.png, inlined below.

  RE-RENDER (Playwright is already a devDependency of this project; run
  from the extension directory):

    node -e "
    import('playwright').then(async ({chromium}) => {
      const b = await chromium.launch();
      const c = await b.newContext({viewport:{width:520,height:340},deviceScaleFactor:2});
      const p = await c.newPage();
      await p.goto('file://' + process.cwd() + '/tools/pin-menu-mockup.html');
      await p.screenshot({path:'onboarding/pin-menu.png',clip:{x:0,y:0,width:520,height:340}});
      await b.close();
    })"

  Palette is onboarding.css / workspace.css: paper #f3efe6, ink #20241f,
  brass #c6a15b.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 520px; height: 340px; }
  body {
    background: #f3efe6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #20241f;
    position: relative;
    overflow: hidden;
  }

  /* ---- the browser window, top-right corner of ---- */
  .win {
    position: absolute;
    /* Off the left edge on purpose, same trick as Profanity Muter's source:
       cropping to the toolbar's right end keeps every distance from the
       RIGHT edge exactly what it was measured against. */
    top: 20px; left: -214px; right: 20px;
    height: 118px;
    background: #dee1e6;
    border-radius: 12px 12px 0 0;
    border: 1.5px solid #c7ccd4;
    border-bottom: none;
    overflow: hidden;
  }
  .tabrow { height: 40px; position: relative; }
  .tab {
    position: absolute; left: 14px; top: 8px;
    width: 220px; height: 32px;
    background: #fff; border-radius: 8px 8px 0 0;
  }
  .tab::after {
    content: ""; position: absolute; left: 14px; top: 12px;
    width: 120px; height: 8px; border-radius: 4px; background: #d5d8de;
  }
  .toolbar {
    height: 78px; background: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 0 18px;
  }
  .omni {
    flex: 1; height: 40px; border-radius: 20px;
    background: #f1f3f4;
    position: relative;
  }
  .omni::after {
    content: ""; position: absolute; left: 22px; top: 16px;
    width: 46%; height: 8px; border-radius: 4px; background: #d5d8de;
  }
  .tbtn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .tbtn svg { width: 22px; height: 22px; fill: #5f6368; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #b9bfce; flex: none;
  }
  .dots { display: flex; flex-direction: column; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #5f6368; }

  /* ---- the Extensions dropdown ---- */
  .menu {
    position: absolute;
    top: 144px; right: 92px;
    width: 340px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(32,36,31,0.22), 0 2px 6px rgba(32,36,31,0.12);
    border: 1.5px solid #e3ddcd;
    padding: 10px 0 8px;
  }
  .menu::before {
    content: ""; position: absolute; top: -8px; right: 63px;
    width: 16px; height: 16px; background: #fff;
    border-left: 1.5px solid #e3ddcd; border-top: 1.5px solid #e3ddcd;
    transform: rotate(45deg);
  }
  .menu h3 {
    font-size: 15px; font-weight: 600; color: #20241f;
    padding: 6px 16px 10px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px;
  }
  .row .dot { width: 24px; height: 24px; border-radius: 50%; background: #d5d8de; flex: none; }
  .row .name { flex: 1; font-size: 14px; color: #666a5f; }
  .row .pin svg { width: 18px; height: 18px; fill: #b9bfce; }
  .row .pin { width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex: none; }

  /* Our row: raised background and a brass ring on its pin control, the
     one control this step is about. Nothing else in the picture is ringed
     - one target, clearly marked. */
  .row--ours {
    background: #f7f3ea;
    border-top: 1.5px solid #efe9db;
    border-bottom: 1.5px solid #efe9db;
  }
  .row--ours .name { color: #20241f; font-weight: 600; }
  .row--ours img { width: 24px; height: 24px; border-radius: 6px; flex: none; }
  .row--ours .pin {
    background: #fbf2dd;
    box-shadow: 0 0 0 3px #c6a15b;
  }
  .row--ours .pin svg { fill: #20241f; }
</style>
